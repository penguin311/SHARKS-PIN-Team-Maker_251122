<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SHARKS'PIN Team Maker (251122ver)</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);  
      color: var(--text-color);
      position: relative;
      overflow: hidden;
    }

    /*떠다니는 이미지 공통 스타일 */
    .floating {
      position: fixed;
      width: 200px;
      height: 200px;
      background: url("s.png") no-repeat center/contain;
      pointer-events: none;
      z-index: 0;
    }

    /*이미지 각각의 위치, 애니메이션 시간 */

    .f1 { top: 10%; left: 5%; animation: float1 18s ease-in-out infinite alternate; }
    .f2 { top: 20%; left: 70%; animation: float2 22s ease-in-out infinite alternate; }
    .f3 { top: 60%; left: 10%; animation: float3 26s ease-in-out infinite alternate; }
    .f4 { top: 70%; left: 80%; animation: float4 20s ease-in-out infinite alternate; }
    .f5 { top: 40%; left: 50%; animation: float5 24s ease-in-out infinite alternate; }
    .f6 { top: 5%; left: 40%; animation: float6 28s ease-in-out infinite alternate; }
    .f7 { top: 75%; left: 30%; animation: float7 23s ease-in-out infinite alternate; }
    .f8 { top: 45%; left: 85%; animation: float8 19s ease-in-out infinite alternate; }

    /*이동 패턴 */

    @keyframes float1 {
      0%{transform:translate(0,0);} 50%{transform:translate(40px,-30px);} 100%{transform:translate(-20px,20px);}
    }
    @keyframes float2 {
      0%{transform:translate(0,0);} 50%{transform:translate(-30px,40px);} 100%{transform:translate(10px,-10px);}
    }
    @keyframes float3 {
      0%{transform:translate(0,0);} 50%{transform:translate(25px,-20px);} 100%{transform:translate(-15px,30px);}
    }
    @keyframes float4 {
      0%{transform:translate(0,0);} 50%{transform:translate(-35px,25px);} 100%{transform:translate(20px,10px);}
    }
    @keyframes float5 {
      0%{transform:translate(0,0);} 50%{transform:translate(30px,20px);} 100%{transform:translate(-10px,-25px);}
    }
    @keyframes float6 {
      0%{transform:translate(0,0);} 50%{transform:translate(-20px,-35px);} 100%{transform:translate(15px,20px);}
    }
    @keyframes float7 {
      0%{transform:translate(0,0);} 50%{transform:translate(40px,15px);} 100%{transform:translate(-20px,-30px);}
    }
    @keyframes float8 {
      0%{transform:translate(0,0);} 50%{transform:translate(-30px,-15px);} 100%{transform:translate(15px,25px);}
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      color: #0078d4;
      margin-bottom: 30px;
      font-size: 60px;
    }

    .section {
      background: var(--card-bg);
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
      display: flex;
      align-items: center;
      margin: 12px 0;
      padding: 6px 0;
      font-size: 20px;
    }

    label input[type="checkbox"] {
      margin-right: 14px;
      width: 24px;
      height: 24px;
      transform: scale(1.4);
      accent-color: #0078d4;
    }

    select, button {
      padding: 20px 30px;
      font-size: 18px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      background-color: #0078d4;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #005a9c;
      transform: translateY(-2px);
    }

    .team {
      margin: 20px 0;
      padding: 15px;
      border-radius: 6px;
      background: var(--card-bg);
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    .team strong {
      display: block;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .team ul {
      list-style: none;
      padding: 0;
    }

    .team ul li {
      margin: 8px 0;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- 떠다니는 s.png 8개 -->
  <div class="floating f1"></div>
  <div class="floating f2"></div>
  <div class="floating f3"></div>
  <div class="floating f4"></div>
  <div class="floating f5"></div>
  <div class="floating f6"></div>
  <div class="floating f7"></div>
  <div class="floating f8"></div>

  <div class="container">
    <h1>SHARKS'PIN <br>Team Maker</h1>

    <div class="section">
      <h2>① 참석자 선택</h2>
      <div id="attendList"></div>
    </div>

    <div class="section">
      <h2>② 팀 수 선택</h2>
      <select id="teamCount">
        <option value="2">2팀</option>
        <option value="3" selected>3팀</option>
        <option value="4">4팀</option>
        <option value="5">5팀</option>
      </select>
      <button id="makeTeams">팀 만들기</button>
    </div>

    <div class="section">
      <h2>③ 팀 결과</h2>
      <div id="teamResults"></div>
    </div>
  </div>

  <script>
    const members = [
      { name: "장욱", ave: 207 },
      { name: "이호", ave: 196 },
      { name: "정원진", ave: 193 },
      { name: "서민형", ave: 189 },
      { name: "박천명", ave: 187 },
      { name: "김현겸", ave: 185 },
      { name: "김병성", ave: 176 },
      { name: "이승태", ave: 174 },
      { name: "김윤희", ave: 174 },
      { name: "정현우", ave: 171 },
      { name: "더블랙민수", ave: 170 },
      { name: "김민수", ave: 196 },
      { name: "고현진", ave: 168 },
      { name: "유혜경", ave: 166 },
      { name: "홍준호", ave: 164 },
      { name: "박상아", ave: 157 },
      { name: "백용덕", ave: 152 },
      { name: "조우리", ave: 145 },
      { name: "김태민", ave: 142 },
      { name: "백홍선", ave: 138 },
      { name: "김현호", ave: 137 },
      { name: "김지환", ave: 131 },
      { name: "이혜진", ave: 122 },
    ];

    const attendListDiv = document.getElementById("attendList");
    const teamCountSelect = document.getElementById("teamCount");
    const makeTeamsBtn = document.getElementById("makeTeams");
    const teamResultsDiv = document.getElementById("teamResults");

    const teamColors = [
      '#E53935','#1E88E5','#43A047','#FB8C00','#8E24AA'
    ];

    members.forEach((m, idx) => {
      const label = document.createElement("label");
      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.value = idx;
      chk.checked = false;
      label.appendChild(chk);
      label.append(` ${m.name} (에버: ${m.ave})`);
      attendListDiv.appendChild(label);
    });

    function makeTeams(attendees, teamCount) {
      attendees.sort((a, b) => b.ave - a.ave);
      const teams = Array.from({ length: teamCount }, () => []);
      const teamSums = Array.from({ length: teamCount }, () => 0);
      const teamCounts = Array.from({ length: teamCount }, () => 0);

      attendees.forEach(m => {
        let bestTeamIndex = 0;
        for (let i = 1; i < teamCount; i++) {
          if (teamSums[i] < teamSums[bestTeamIndex] ||
              (teamSums[i] === teamSums[bestTeamIndex] && teamCounts[i] < teamCounts[bestTeamIndex])) {
            bestTeamIndex = i;
          }
        }
        teams[bestTeamIndex].push(m);
        teamSums[bestTeamIndex] += m.ave;
        teamCounts[bestTeamIndex] += 1;
      });

      return { teams, teamSums, teamCounts };
    }

    makeTeamsBtn.addEventListener("click", () => {
      const selectedIdx = Array.from(
        attendListDiv.querySelectorAll("input[type=checkbox]:checked")
      ).map(chk => parseInt(chk.value));

      const attendees = selectedIdx.map(i => members[i]);
      const teamCount = parseInt(teamCountSelect.value);

      if (attendees.length < teamCount) {
        alert("참석자 수가 팀 수보다 많아야 합니다.");
        return;
      }

      const { teams, teamSums, teamCounts } = makeTeams(attendees, teamCount);
      teamResultsDiv.innerHTML = "";

      teams.forEach((team, idx) => {
        const div = document.createElement("div");
        div.className = "team";
        const color = teamColors[idx % teamColors.length];
        div.style.borderLeftColor = color;
        div.style.backgroundColor = `${color}20`;

        const sum = teamSums[idx];
        div.innerHTML =
          `<strong style="color:${color}">${idx+1}팀 인원: ${teamCounts[idx]}<br>(합계: ${sum})</strong>` +
          `<ul>${team.map(m => `<li>${m.name} (${m.ave})</li>`).join("")}</ul>`;

        teamResultsDiv.appendChild(div);
      });
    });
  </script>
</body>
</html>
