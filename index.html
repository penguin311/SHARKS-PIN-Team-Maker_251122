<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 화면 크기 맞추기 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHARKS'PIN Team Maker (251122ver)</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      position: relative;
      /* 세로 스크롤은 허용, 가로 스크롤은 숨김 */
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* s.png 공통 스타일 (위치는 JS에서 관리) */
    .floating {
      position: fixed;
      width: 50px;
      height: 50px;
      background: url("s.png") no-repeat center/contain;
      pointer-events: none;  /* 클릭 막지 않게 */
      z-index: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;  /* 떠다니는 이미지보다 위에 보이도록 */
    }

    h1 {
      text-align: center;
      color: #0078d4;
      margin-bottom: 30px;
      font-size: 60px;
    }

    .section {
      background: var(--card-bg);
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
      display: flex;
      align-items: center;
      margin: 12px 0;
      padding: 6px 0;
      font-size: 20px;
    }

    label input[type="checkbox"] {
      margin-right: 14px;
      width: 24px;
      height: 24px;
      transform: scale(1.4);
      accent-color: #0078d4;
    }

    select, button {
      padding: 20px 30px;
      font-size: 18px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      background-color: #0078d4;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #005a9c;
      transform: translateY(-2px);
    }

    .team {
      margin: 20px 0;
      padding: 15px;
      border-radius: 6px;
      background: var(--card-bg);
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    .team strong {
      display: block;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .team ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .team ul li {
      margin: 8px 0;
      font-size: 20px;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .container { padding: 10px; }
      h1 {
        font-size: 40px;
        margin-bottom: 20px;
      }
      select, button { font-size: 14px; padding: 10px; }
      .team strong { font-size: 16px; }
      label { font-size: 18px; }
      label input[type="checkbox"] {
        width: 20px;
        height: 20px;
        transform: scale(1.2);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SHARKS'PIN <br>Team Maker</h1>

    <div class="section">
      <h2>① 참석자 선택</h2>
      <div id="attendList"></div>
    </div>

    <div class="section">
      <h2>② 팀 수 선택</h2>
      <select id="teamCount">
        <option value="2">2팀</option>
        <option value="3" selected>3팀</option>
        <option value="4">4팀</option>
        <option value="5">5팀</option>
      </select>
      <button id="makeTeams">팀 만들기</button>
    </div>

    <div class="section">
      <h2>③ 팀 결과</h2>
      <div id="teamResults"></div>
    </div>
  </div>

  <script>
    /* 물리 효과로 */

    const FLOATING_COUNT = 20;
    const SIZE = 50;                  // 이미지 크기 (px)
    const RADIUS = SIZE / 2;
    const SPEED = 1.5;                 // 속도 (보통 정도)
    const MAX_SPEED = 4;               // 속도 상한 (폭주 방지)

    const floaters = [];

    function clampSpeed(f) {
      const speed = Math.hypot(f.vx, f.vy);
      if (speed > MAX_SPEED) {
        const ratio = MAX_SPEED / speed;
        f.vx *= ratio;
        f.vy *= ratio;
      }
    }

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomVelocity() {
      const angle = Math.random() * Math.PI * 2;
      return {
        vx: Math.cos(angle) * SPEED,
        vy: Math.sin(angle) * SPEED
      };
    }

    function randomNonOverlappingPosition(existing) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      let x, y;
      let tries = 0;

      while (true) {
        x = randomRange(RADIUS, width - RADIUS);
        y = randomRange(RADIUS, height - RADIUS);

        let overlap = false;
        for (const f of existing) {
          const dx = f.x - x;
          const dy = f.y - y;
          const dist = Math.hypot(dx, dy);
          if (dist < SIZE) { // 두 반지름의 합 = SIZE
            overlap = true;
            break;
          }
        }

        if (!overlap || tries > 100) {
          return { x, y };
        }
        tries++;
      }
    }

    function createFloaters() {
      for (let i = 0; i < FLOATING_COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'floating';
        document.body.appendChild(el);

        const pos = randomNonOverlappingPosition(floaters);
        const vel = randomVelocity();

        const floater = {
          el,
          x: pos.x,
          y: pos.y,
          vx: vel.vx,
          vy: vel.vy
        };

        clampSpeed(floater);
        floaters.push(floater);
      }
    }

    function handleWallCollision(f) {
      const width = window.innerWidth;
      const height = window.innerHeight;

      if (f.x - RADIUS <= 0 && f.vx < 0) {
        f.vx *= -1;
        f.x = RADIUS;
      } else if (f.x + RADIUS >= width && f.vx > 0) {
        f.vx *= -1;
        f.x = width - RADIUS;
      }

      if (f.y - RADIUS <= 0 && f.vy < 0) {
        f.vy *= -1;
        f.y = RADIUS;
      } else if (f.y + RADIUS >= height && f.vy > 0) {
        f.vy *= -1;
        f.y = height - RADIUS;
      }
    }

    function handleFloaterCollisions() {
      for (let i = 0; i < floaters.length; i++) {
        for (let j = i + 1; j < floaters.length; j++) {
          const a = floaters[i];
          const b = floaters[j];

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = SIZE; // RADIUS + RADIUS

          if (dist > 0 && dist < minDist) {
            const nx = dx / dist;
            const ny = dy / dist;

            const overlap = (minDist - dist) / 2;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;

            const dvx = a.vx - b.vx;
            const dvy = a.vy - b.vy;
            const relVel = dvx * nx + dvy * ny;

            if (relVel > 0) continue;

            const impulse = -2 * relVel / 2;

            a.vx += -impulse * nx;
            a.vy += -impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;

            clampSpeed(a);
            clampSpeed(b);
          }
        }
      }
    }

    function updateFloaters() {
      for (const f of floaters) {
        f.x += f.vx;
        f.y += f.vy;
        handleWallCollision(f);
        f.el.style.left = (f.x - RADIUS) + 'px';
        f.el.style.top  = (f.y - RADIUS) + 'px';
      }
    }

    function animate() {
      handleFloaterCollisions();
      updateFloaters();
      requestAnimationFrame(animate);
    }

    createFloaters();
    animate();


    /* 팀명단 */

    const members = [

      { name: "정원진", ave: 198.33 },
      { name: "서민형", ave: 180.83 },
      { name: "박천명", ave: 185.28 },
      { name: "김병성", ave: 161.98 },
      { name: "이승태", ave: 170.98 },
      { name: "김윤희", ave: 173.1 },
      { name: "정현우", ave: 159.38 },
      { name: "김민수", ave: 194.53 },
      { name: "고현진", ave: 181.23 },
      { name: "유혜경", ave: 169.73 },
      { name: "홍준호", ave: 164.65 },
      { name: "조우리", ave: 148.2 },
      { name: "김태민", ave: 133.53 },
      { name: "김현호", ave: 196.43},
      { name: "장수완", ave: 113.4 },
      { name: "김지민", ave: 168 },
      { name: "최진환", ave: 130 },
      { name: "김용수", ave: 130 },
      { name: "게스트1", ave: 150 },
      { name: "게스트2", ave: 160 },
      { name: "게스트3", ave: 170 },
      { name: "게스트4", ave: 180 },
      { name: "게스트5", ave: 190 }
      { name: "게스트6", ave: 200 }
      
     
      
    ];

    const attendListDiv = document.getElementById("attendList");
    const teamCountSelect = document.getElementById("teamCount");
    const makeTeamsBtn = document.getElementById("makeTeams");
    const teamResultsDiv = document.getElementById("teamResults");

    const teamColors = [
      '#E53935',
      '#1E88E5',
      '#43A047',
      '#FB8C00',
      '#8E24AA'
    ];

    members.forEach((m, idx) => {
      const label = document.createElement("label");
      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.value = idx;
      chk.checked = false;
      label.appendChild(chk);
      label.append(` ${m.name} (에버: ${m.ave})`);
      attendListDiv.appendChild(label);
    });

    function makeTeams(attendees, teamCount) {
      attendees.sort((a, b) => b.ave - a.ave);
      const teams = Array.from({ length: teamCount }, () => []);
      const teamSums = Array.from({ length: teamCount }, () => 0);
      const teamCounts = Array.from({ length: teamCount }, () => 0);

      attendees.forEach(m => {
        let bestTeamIndex = 0;
        for (let i = 1; i < teamCount; i++) {
          if (
            teamSums[i] < teamSums[bestTeamIndex] ||
            (teamSums[i] === teamSums[bestTeamIndex] && teamCounts[i] < teamCounts[bestTeamIndex])
          ) {
            bestTeamIndex = i;
          }
        }
        teams[bestTeamIndex].push(m);
        teamSums[bestTeamIndex] += m.ave;
        teamCounts[bestTeamIndex] += 1;
      });

      return { teams, teamSums, teamCounts };
    }

    makeTeamsBtn.addEventListener("click", () => {
      const selectedIdx = Array.from(
        attendListDiv.querySelectorAll("input[type=checkbox]:checked")
      ).map(chk => parseInt(chk.value));

      const attendees = selectedIdx.map(i => members[i]);
      const teamCount = parseInt(teamCountSelect.value);

      if (attendees.length < teamCount) {
        alert("참석자 수가 팀 수보다 많아야 합니다.");
        return;
      }

      const { teams, teamSums, teamCounts } = makeTeams(attendees, teamCount);

      teamResultsDiv.innerHTML = "";
      teams.forEach((team, idx) => {
        const div = document.createElement("div");
        div.className = "team";
        const color = teamColors[idx % teamColors.length];
        div.style.borderLeftColor = color;
        div.style.backgroundColor = `${color}20`;
        const sum = teamSums[idx];
        div.innerHTML =
          `<strong style="color:${color}"> ${idx+1}팀 인원: ${teamCounts[idx]} <br>(합계: ${sum})</strong>` +
          `<ul>${team.map(m => `<li>${m.name} (${m.ave})</li>`).join("")}</ul>`;
        teamResultsDiv.appendChild(div);
      });
    });
  </script>
</body>
</html>
